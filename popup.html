<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Tab Always Alive</title>
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<main>
			<header>
				<h1>Tab Always Alive</h1>
				<p id="site" class="site">Current tab</p>
			</header>

			<button id="power" class="power" type="button" aria-pressed="false" disabled>OFF</button>

			<p id="state" class="state">Inactive</p>
			<p id="message" class="message" hidden></p>
		</main>

		<script src="popup.js"></script>
	</body>
</html>
